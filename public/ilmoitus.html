<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ilmoita havainnosta – Turvajohto OS</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #f8fafc; padding: 1rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #1e293b;
      }
      .kortti {
        width: 100%; max-width: 32rem; background: #fff; border: 1px solid #e2e8f0;
        border-radius: 0.75rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 1.5rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
      .vaimea { color: #64748b; font-size: .875rem; margin: 0 0 1rem; }
      label { display: block; font-size: .8125rem; font-weight: 600; margin: 1rem 0 .25rem; }
      label .valinnainen { font-weight: 400; color: #64748b; }
      textarea, input {
        font: inherit; width: 100%; border-radius: .5rem; border: 1px solid #cbd5e1;
        padding: .625rem .75rem; background: #fff; color: inherit;
      }
      textarea { min-height: 8rem; resize: vertical; }
      textarea:focus, input:focus { outline: 2px solid #4f46e5; outline-offset: 1px; border-color: #4f46e5; }
      .laskuri { font-size: .75rem; color: #94a3b8; text-align: right; margin-top: .25rem; }
      button {
        font: inherit; width: 100%; margin-top: 1.25rem; border-radius: .5rem;
        background: #4f46e5; color: #fff; border: 1px solid #4f46e5; font-weight: 700;
        padding: .75rem 1rem; cursor: pointer;
      }
      button:hover { background: #4338ca; }
      button:disabled { opacity: .6; cursor: default; }
      .virhe { color: #e11d48; font-size: .875rem; margin: .75rem 0 0; }
      .hata {
        color: #9f1239; background: #fff1f2; border: 1px solid #fecdd3; border-radius: .5rem;
        padding: .75rem; font-size: .875rem; font-weight: 600; margin: 0 0 1rem;
      }
      .tietosuoja {
        margin: 1.25rem 0 0; padding-top: 1rem; border-top: 1px solid #e2e8f0;
        font-size: .75rem; color: #64748b; line-height: 1.5;
      }
      .valmis { text-align: center; padding: 1rem 0; }
      .valmis .merkki {
        width: 3rem; height: 3rem; margin: 0 auto .75rem; border-radius: 999px;
        background: #ecfdf5; color: #019765; display: flex; align-items: center;
        justify-content: center; font-size: 1.75rem; line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="kortti" id="kortti">
      <p class="vaimea">Ladataan…</p>
    </div>

    <script src="/ilmoitus.js"></script>
  </body>
</html>
