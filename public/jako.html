<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Jaettu tiedosto – Turvajohto OS</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #f8fafc; padding: 1rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #1e293b;
      }
      .kortti {
        width: 100%; max-width: 30rem; background: #fff; border: 1px solid #e2e8f0;
        border-radius: 0.75rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 1.5rem;
      }
      h1 { font-size: 1.125rem; margin: 0 0 .25rem; }
      .vaimea { color: #64748b; font-size: .875rem; margin: 0 0 1rem; }
      .rivi {
        display: flex; align-items: center; justify-content: space-between; gap: .75rem;
        padding: .625rem .75rem; border: 1px solid #e2e8f0; border-radius: .5rem; margin-bottom: .5rem;
      }
      .nimi { font-size: .875rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      button, input {
        font: inherit; border-radius: .5rem; border: 1px solid #cbd5e1; padding: .5rem .75rem;
      }
      button {
        background: #4f46e5; color: #fff; border-color: #4f46e5; font-weight: 700; cursor: pointer;
      }
      button:hover { background: #4338ca; }
      button:disabled { opacity: .6; cursor: default; }
      button.toissijainen { background: #f1f5f9; color: #334155; border-color: #e2e8f0; font-weight: 500; }
      input { width: 100%; margin-bottom: .5rem; }
      .virhe { color: #e11d48; font-size: .875rem; }
      /* Dokumenttieditori koko ikkunan päälle (editorikehys.js). */
      .editorikehys { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; z-index: 10; }
      .napit { display: flex; gap: .375rem; flex-shrink: 0; }
      .info { color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: .5rem; padding: .75rem; font-size: .8125rem; }
    </style>
  </head>
  <body>
    <div class="kortti" id="kortti">
      <p class="vaimea">Ladataan…</p>
    </div>

    <script src="/editorikehys.js"></script>
    <script src="/jako.js"></script>
  </body>
</html>
