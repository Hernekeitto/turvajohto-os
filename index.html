      <div style="background:#232f40; color:#e2e8f0; min-height:100vh; margin:0; padding:4rem 1.5rem; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height:1.65;">
        <div style="max-width:48rem; margin:0 auto;">
          <h1 style="color:#fff; font-size:2.25rem; text-align:center; margin:0 0 1.5rem;">
            Turvajohto <span style="color:#818cf8;">OS</span>
          </h1>
          <p style="margin:0 0 1rem;">
            Turvajohto OS on suomalainen, koko turvallisuusalalle suunniteltu edistyksellinen
            ohjelmistoalusta, joka yhdistää tapahtumaturvallisuuden, järjestyksenvalvonnan ja
            perinteisen vartioinnin tietohallinnan saumattomaksi kokonaisuudeksi. Tämä moderni ja
            käyttäjien tarpeeseen kehitetty SaaS-palvelu tarjoaa turvallisuusjohdolle
            reaaliaikaisen ja keskitetyn tilannekuvan, jonka ytimessä on dynaaminen
            valvomokojelauta aktiivisine hälytyksineen, lokikirjauksineen ja
            poikkeamaseurantoineen. Järjestelmä on digitaalinen sydän, joka poistaa
            paperilomakkeet ja pitää osa-alueiden langat tiukasti yksissä käsissä.
          </p>
          <p style="color:#fff; font-weight:500; margin:0 0 1rem;">
            Turvajohto OS on koko turvallisuusalan käyttöjärjestelmä. Se korvaa useat irralliset
            ohjelmistot yhdellä älykkäällä ja skaalautuvalla ratkaisulla, jollaista ei löydy
            muualta.
          </p>

          <h2 style="color:#fff; font-size:1.25rem; margin:2.5rem 0 .25rem;">Turvajohto EVENT</h2>
          <p style="color:#94a3b8; font-size:.875rem; margin:0 0 .5rem;">Tapahtumaturvallisuus</p>
          <p style="margin:0 0 1rem;">
            Turvajohto EVENT on luotu massatapahtumien ja järjestyksenvalvonnan dynaamiseen
            johtamiseen! Lopeta monien eri järjestelmien yhteiskäyttö ja ota kaikki
            turvallisuuden osa-alueet digitaalisesti haltuun yhdestä paikasta!
          </p>

          <h2 style="color:#fff; font-size:1.25rem; margin:2rem 0 .25rem;">Turvajohto GUARD</h2>
          <p style="color:#94a3b8; font-size:.875rem; margin:0 0 .5rem;">Vartiointi</p>
          <p style="margin:0 0 1rem;">
            Perinteinen liikkuva vartiointi ja kohdevartiointi vaativat oikeat työkalut. Siksi loimme
            Turvajohto GUARDin – ammattilaisten ohjelmiston, joka on rakennettu vaativaan
            kenttätyöhön! Turvajohto GUARD ei ole vain ohjelmisto. Se on sinun digitaalinen
            työpari.
          </p>
