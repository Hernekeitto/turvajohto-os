# Collabora Online (CODE) — nginx-lohkot. Asennusskripti kopioi tämän tiedoston
# polkuun /etc/nginx/snippets/turvajohto-collabora.conf, ja se sisällytetään
# Toimiston omaan server-lohkoon (toimisto.conf, toimisto.turvajohto-os.fi).
#
# 28.9.2026–29.9.2026 nämä lohkot olivat sovelluksen omassa server-lohkossa
# (turvajohto-os.fi). Siirretty omaan aliverkkotunnukseen, ks. toimisto.conf.
#
# Näissä lohkoissa EI ole omaa add_header-riviä, joten ne perivät server-lohkon
# otsakkeet (toimisto.conf). Collaboran sivu lähettää oman CSP:nsä.
#
# /hosting/discovery EI ole tässä: backend hakee sen suoraan kontista
# (COLLABORA_SISAINEN_URL), eikä selain tarvitse sitä.

# Hallintakonsoli pois julkisesta verkosta. Pidempi prefiksi voittaa /cool/- ja
# /browser/-lohkot.
location ^~ /cool/adminws {
    deny all;
}
location ^~ /browser/dist/admin {
    deny all;
}

# Collaboran REST-rajapinnat pois julkisesta verkosta (korjattu 28.9.2026).
#
# Collabora sallii nämä vain "luotetuista" osoitteista (net.post_allow, oletuksena
# yksityiset verkot ja localhost). Koska kaikki liikenne tulee nginxin kautta
# osoitteesta 127.0.0.1, Collabora piti KOKO INTERNETIÄ luotettuna: kuka tahansa pystyi
# muuntamaan tiedostoja palvelimellamme (todennettu: POST /cool/convert-to/pdf palautti
# PDF:n ilman tunnistautumista). Se on sekä resurssien väärinkäyttöä että avoin väylä
# syöttää mielivaltaisia tiedostoja LibreOfficen jäsennettäväksi. Editori ei tarvitse
# näitä: se käyttää vain istuntokohtaisia /cool/<WOPISrc>/...-polkuja.
#
# Pidempi ^~-prefiksi voittaa /cool/-lohkon, joten nämä on lueteltava erikseen.
location ^~ /cool/convert-to { deny all; }
location ^~ /cool/extract-link-targets { deny all; }
location ^~ /cool/extract-document-structure { deny all; }
location ^~ /cool/transform-document-structure { deny all; }
location ^~ /cool/get-thumbnail { deny all; }
location ^~ /cool/render-search-result { deny all; }
location ^~ /cool/getMetrics { deny all; }

# Editorin staattiset tiedostot ja cool.html.
location ^~ /browser/ {
    proxy_pass http://127.0.0.1:9980;
    proxy_set_header Host $host;
}

# Dokumentin WebSocket ja muut /cool/-kutsut (lataus, tulostus, lisätyt kuvat).
# Connection-otsake välitetään sellaisenaan: WebSocketille se on "Upgrade", tavalliselle
# pyynnölle "keep-alive" — näin yksi lohko kattaa molemmat ilman map-lohkoa.
location ^~ /cool/ {
    proxy_pass http://127.0.0.1:9980;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_read_timeout 36000s;
    client_max_body_size 20m;
}
