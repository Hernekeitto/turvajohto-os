# Collabora Online (CODE) — nginx-lohkot. Asennusskripti kopioi tämän tiedoston
# polkuun /etc/nginx/snippets/turvajohto-collabora.conf ja lisää include-rivin
# sivuston 443-server-lohkoon (/etc/nginx/sites-available/sivusto).
#
# Collabora on samassa domainissa kuin sovellus, jotta editorin iframe ja token-lomake
# pysyvät sovelluksen CSP:n 'self'-rajoissa (frame-src perii default-srcin,
# form-action 'self'). Näissä lohkoissa EI ole omaa add_header-riviä, joten ne perivät
# server-tason turvaotsakkeet (HSTS, X-Frame-Options SAMEORIGIN, nosniff, Referrer-
# Policy) mutta EIVÄT sovelluksen CSP:tä, joka on vain /- ja /index.html-lohkoissa.
# Se on tarkoitus: Collaboran sivu lähettää oman CSP:nsä, ja sovelluksen CSP
# (script-src 'self' ilman unsafe-inlineä) rikkoisi editorin.
#
# /hosting/discovery EI ole tässä: backend hakee sen suoraan kontista
# (COLLABORA_SISAINEN_URL), eikä selain tarvitse sitä.

# Hallintakonsoli pois julkisesta verkosta. Pidempi prefiksi voittaa /cool/- ja
# /browser/-lohkot.
location ^~ /cool/adminws {
    deny all;
}
location ^~ /browser/dist/admin {
    deny all;
}

# Editorin staattiset tiedostot ja cool.html.
location ^~ /browser/ {
    proxy_pass http://127.0.0.1:9980;
    proxy_set_header Host $host;
}

# Dokumentin WebSocket ja muut /cool/-kutsut (lataus, tulostus, lisätyt kuvat).
# Connection-otsake välitetään sellaisenaan: WebSocketille se on "Upgrade", tavalliselle
# pyynnölle "keep-alive" — näin yksi lohko kattaa molemmat ilman map-lohkoa.
location ^~ /cool/ {
    proxy_pass http://127.0.0.1:9980;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_read_timeout 36000s;
    client_max_body_size 20m;
}
