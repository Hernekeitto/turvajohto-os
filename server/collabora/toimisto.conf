# Toimisto (Collabora Online) omassa aliverkkotunnuksessaan toimisto.turvajohto-os.fi.
# Asennusskripti kopioi tämän polkuun /etc/nginx/sites-available/toimisto.
#
# MIKSI OMA ALIVERKKOTUNNUS (29.9.2026): Collabora oli aiemmin samassa originissa
# (turvajohto-os.fi) kuin sovellus. Silloin mikä tahansa XSS-haavoittuvuus Collaborassa
# — esim. muokattuun dokumenttiin upotetulla sisällöllä laukaistu — olisi ajanut
# hyökkääjän koodia sovelluksen originissa uhrin istunnolla. Omassa originissaan
# Collaboran koodi ei pääse sovelluksen dataan: kirjautumiseväste on host-only
# (ei Domain-attribuuttia), joten sitä ei lähetetä tänne lainkaan, eikä selain anna
# toisen originin skriptin lukea sovelluksen sivuja tai tehdä sen nimissä pyyntöjä.
#
# Collabora hakee dokumentit edelleen WOPI-rajapinnasta osoitteesta
# https://turvajohto-os.fi/api/wopi/ (aliasgroup1 kontin asetuksissa).

server {
    listen 80;
    server_name toimisto.turvajohto-os.fi;

    # Let's Encryptin uusinta (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name toimisto.turvajohto-os.fi;

    ssl_certificate /etc/letsencrypt/live/toimisto.turvajohto-os.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toimisto.turvajohto-os.fi/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Periytyvät snippetin location-lohkoihin (niissä ei ole omaa add_header-riviä).
    # X-Frame-Optionsia EI aseteta: editori upotetaan sovelluksen (turvajohto-os.fi)
    # iframeen, joka on eri origin. Upotuksen rajaa Collaboran oma CSP frame-ancestors,
    # joka sallii vain WOPI-isännän (kontin net.frame_ancestors).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include snippets/turvajohto-collabora.conf;

    # Kaikki muu: ei mitään.
    location / {
        return 404;
    }
}
